<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 150" width="340" height="150" role="img" aria-label="Feynman diagram of the scattering process c d to R to a b">
  <title>Scattering process c_j d_j → R → a_i b_i</title>
  <rect width="340" height="150" fill="#ffffff" />
  <g fill="none" stroke="#000000" stroke-width="1.6">
    <line x1="34" y1="25" x2="120" y2="75" />
    <line x1="34" y1="125" x2="120" y2="75" />
    <line x1="120" y1="75" x2="220" y2="75" stroke-width="2.4" />
    <line x1="220" y1="75" x2="306" y2="25" />
    <line x1="220" y1="75" x2="306" y2="125" />
  </g>
  <g fill="#000000" font-family="Latin Modern Math, Georgia, serif" font-style="italic" font-size="17">
    <text x="26" y="25" text-anchor="end" dominant-baseline="middle">c<tspan font-size="12" dy="5">j</tspan></text>
    <text x="26" y="125" text-anchor="end" dominant-baseline="middle">d<tspan font-size="12" dy="5">j</tspan></text>
    <text x="170" y="62" text-anchor="middle">R</text>
    <text x="314" y="25" text-anchor="start" dominant-baseline="middle">a<tspan font-size="12" dy="5">i</tspan></text>
    <text x="314" y="125" text-anchor="start" dominant-baseline="middle">b<tspan font-size="12" dy="5">i</tspan></text>
  </g>
</svg>

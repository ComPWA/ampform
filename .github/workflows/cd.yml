name: CD

on:
  release:
    types:
      - prereleased
      - released

jobs:
  milestone:
    if: startsWith(github.ref, 'refs/tags')
    uses: ComPWA/actions/.github/workflows/close-milestone.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
  package-name:
    uses: ComPWA/actions/.github/workflows/get-pypi-name.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
  pypi:
    environment:
      name: PyPI
      url: https://pypi.org/p/${{ needs.package-name.outputs.name }}
    if: startsWith(github.ref, 'refs/tags')
    name: Publish to PyPI
    needs:
      - package-name
    permissions:
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: ComPWA/actions/build-pypi-distribution@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
  push:
    if: startsWith(github.ref, 'refs/tags') && !github.event.release.prerelease
    permissions:
      contents: write
    uses: ComPWA/actions/.github/workflows/push-to-version-branches.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0

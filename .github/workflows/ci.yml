name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@957d1151460aea469a230150b61cc3c99d3f0a0a # 4.1.2
    permissions:
      pages: write
      id-token: write
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@957d1151460aea469a230150b61cc3c99d3f0a0a # 4.1.2
  test:
    uses: ComPWA/actions/.github/workflows/test.yml@957d1151460aea469a230150b61cc3c99d3f0a0a # 4.1.2
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      coverage-python-version: "3.14"
      macos-python-version: "3.11"

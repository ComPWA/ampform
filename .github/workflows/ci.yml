name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
    permissions:
      pages: write
      id-token: write
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
  test:
    uses: ComPWA/actions/.github/workflows/test.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0
    with:
      coverage-python-version: "3.14"
      macos-python-version: "3.11"
  linkcheck:
    uses: ComPWA/actions/.github/workflows/ci-linkcheck.yml@a024afbb9e182bea4924a73fc60ae59462849ebb # v4.2.0

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: |-
    ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

on:
  push:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  pull_request:
    branches:
      - main
      - epic/*
      - "[0-9]+.[0-9]+.x"
  workflow_dispatch:

jobs:
  doc:
    uses: ComPWA/actions/.github/workflows/ci-docs.yml@7c6e43f917c43b95ed9197b2bc3839f2f3139455 # main
    permissions:
      pages: write
      id-token: write
  style:
    secrets:
      token: ${{ secrets.PAT }}
    uses: ComPWA/actions/.github/workflows/style.yml@7c6e43f917c43b95ed9197b2bc3839f2f3139455 # main
  test:
    uses: ComPWA/actions/.github/workflows/test.yml@7c6e43f917c43b95ed9197b2bc3839f2f3139455 # main
    with:
      coverage-python-version: "3.14"
      macos-python-version: "3.11"
  linkcheck:
    uses: ComPWA/actions/.github/workflows/ci-linkcheck.yml@7c6e43f917c43b95ed9197b2bc3839f2f3139455 # main
